name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches the packaged version
        # Tagging before the release PR merges points the tag at a commit whose
        # pyproject.toml still says the OLD version. The build then produces that old
        # version, PyPI refuses the duplicate, and the failure reads as a credential or
        # packaging problem rather than "you tagged the wrong commit" — while the fix
        # you meant to ship is still on an unmerged branch.
        #
        # Skipped for workflow_dispatch, which has no tag to compare against.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import re,io;print(re.search(r'(?m)^version = \"([^\"]+)\"', io.open('pyproject.toml',encoding='utf-8').read()).group(1))")
          echo "tag=$TAG pyproject=$PYPROJECT"
          if [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::tag v$TAG does not match pyproject.toml version $PYPROJECT — is the release PR merged?"
            exit 1
          fi
          echo "publishing $TAG"

      - name: Install build tools
        run: pip install hatch build

      - name: Build package
        run: python -m build

      - name: Check the built artifact carries the tagged version
        # The gate above reads the source. This reads what was actually produced, so a
        # build backend resolving the version from somewhere else cannot slip past.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ls -1 dist/
          if ! ls dist/ | grep -q "^langchain_jarvisclaw-${TAG}-py3-none-any\.whl$"; then
            echo "::error::dist/ has no langchain_jarvisclaw-${TAG}-py3-none-any.whl"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
